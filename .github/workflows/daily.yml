name: Daily stats refresh

on:
  schedule:
    # 09:23 UTC daily. gametools caches upstream for 10 minutes, so exact
    # timing does not matter — only that we call it once a day.
    #
    # Deliberately NOT on the hour. GitHub runs scheduled workflows on shared
    # capacity and delays or drops them under load, and :00 is the most
    # contended minute there is. At '0 9 * * *' this job never once started on
    # time: the two runs it managed began at 14:16 and 15:49 UTC, five and
    # nearly seven hours late, and 2026-09-16 was skipped outright.
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  # Only needs to push the regenerated data. No API keys: gametools is
  # unauthenticated, so this workflow has no secrets.
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Fetch Gauntlet stats
        run: npm run data

      - name: Commit if anything changed
        run: |
          git config user.name "gauntlemen-league-bot"
          git config user.email "actions@github.com"
          git add data/ roster.json
          if git diff --staged --quiet; then
            echo "No changes today."
            exit 0
          fi
          git commit -m "chore: daily stats refresh $(date -u +%Y-%m-%d)"
          git push
