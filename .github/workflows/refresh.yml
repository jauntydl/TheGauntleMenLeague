name: Stats refresh

on:
  schedule:
    # Every two hours at :23 UTC (00:23, 02:23, … 22:23). gametools caches
    # upstream for 10 minutes, so exact timing does not matter.
    #
    # Deliberately NOT on the hour. GitHub runs scheduled workflows on shared
    # capacity and delays or drops them under load, and :00 is the most
    # contended minute there is. At '0 9 * * *' this job never once started on
    # time: the two runs it managed began at 14:16 and 15:49 UTC, five and
    # nearly seven hours late, and 2026-09-16 was skipped outright.
    #
    # Four-hourly rather than daily since 2026-10-31. With one slot a day, a
    # run that slipped by seven hours or died on an API hiccup cost the board
    # a whole day; five such days in a row left it stale from Oct 25 to 31.
    # Two-hourly since 2026-11-02 (the user's call), alongside the owner's
    # hidden manual refresh (app/api/refresh), which dispatches this workflow.
    - cron: '23 */2 * * *'
  workflow_dispatch:

# A manual refresh can land while a scheduled one is running; queue it behind
# rather than racing it to push. Never cancel: a cancelled run loses its data.
concurrency:
  group: stats-refresh
  cancel-in-progress: false

permissions:
  # Only needs to push the regenerated data. No API keys: gametools is
  # unauthenticated, so this workflow has no secrets.
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Fetch stats
        run: npm run data

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "gauntlemen-league-bot"
          git config user.email "actions@github.com"
          git add data/ roster.json
          if git diff --staged --quiet; then
            echo "No changes this run."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: stats refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The push no longer redeploys the site: vercel.json skips the build
      # for a data-only commit, and the site reads data/board.json from the
      # repo at request time, cached for a minute (lib/data). This call purges
      # that cache so the new board shows at once. It needs REVALIDATE_SECRET
      # as a repo secret matching the Vercel env var; without it, or if the
      # site does not answer, the minute's cache does the job, so neither is
      # a reason to fail a run whose data is already pushed.
      - name: Tell the site to re-read the board
        if: steps.commit.outputs.pushed == 'true'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://the-gauntle-men-league.vercel.app
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET is not set; the board updates within a minute anyway."
            exit 0
          fi
          curl -fsS -X POST "$SITE_URL/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            || echo "Revalidate call failed; the board updates within a minute anyway."
