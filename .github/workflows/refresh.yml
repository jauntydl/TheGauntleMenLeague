name: Stats refresh

on:
  schedule:
    # Every four hours at :23 UTC (00:23, 04:23, … 20:23). gametools caches
    # upstream for 10 minutes, so exact timing does not matter.
    #
    # Deliberately NOT on the hour. GitHub runs scheduled workflows on shared
    # capacity and delays or drops them under load, and :00 is the most
    # contended minute there is. At '0 9 * * *' this job never once started on
    # time: the two runs it managed began at 14:16 and 15:49 UTC, five and
    # nearly seven hours late, and 2026-09-16 was skipped outright.
    #
    # Four-hourly rather than daily since 2026-10-31. With one slot a day, a
    # run that slipped by seven hours or died on an API hiccup cost the board
    # a whole day; five such days in a row left it stale from Oct 25 to 31.
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  # Only needs to push the regenerated data. No API keys: gametools is
  # unauthenticated, so this workflow has no secrets.
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Fetch stats
        run: npm run data

      - name: Commit if anything changed
        run: |
          git config user.name "gauntlemen-league-bot"
          git config user.email "actions@github.com"
          git add data/ roster.json
          if git diff --staged --quiet; then
            echo "No changes this run."
            exit 0
          fi
          git commit -m "chore: stats refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
